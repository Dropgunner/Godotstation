name: Playtest build

# Exports downloadable debug builds for a hands-on two-player playtest.
# Download them from the run's Artifacts section.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/playtest-build.yml
      - tools/export_playtest.sh

permissions:
  contents: read

concurrency:
  group: playtest-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GODOT_VERSION: 4.4.1-stable
      GODOT_TEMPLATE_DIR: 4.4.1.stable.mono
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot .NET and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sSLf -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64" >> "$GITHUB_ENV"
          curl -sSLf -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "$RUNNER_TEMP/templates/templates" "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          rm -f "$RUNNER_TEMP/templates.tpz" "$RUNNER_TEMP/godot.zip"

      - name: Export Linux, Windows and macOS builds
        run: |
          for platform in linux windows macos; do
            echo "::group::export $platform"
            bash tools/export_playtest.sh "$platform" "out/$platform"
            echo "::endgroup::"
          done

      # Proves the exported game, not the editor, runs a shared round between two processes.
      - name: Two-client checks on the exported Linux build
        run: |
          for mode in movement --pull; do
            echo "::group::smoke $mode"
            PLAYTEST_BIN="$PWD/out/linux/Godotstation.x86_64" bash tools/multiplayer_smoke.sh "$mode"
            echo "::endgroup::"
          done

      - name: Package builds
        run: |
          cp planning/PLAYTEST_CHECKLIST.md out/linux/ && cp planning/PLAYTEST_CHECKLIST.md out/windows/
          tar -C out/linux -czf out/Godotstation-linux.tar.gz .
          (cd out/windows && zip -qr ../Godotstation-windows.zip .)
          cp out/macos/Godotstation.zip out/Godotstation-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Godotstation-linux
          path: out/Godotstation-linux.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Godotstation-windows
          path: out/Godotstation-windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Godotstation-macos
          path: out/Godotstation-macos.zip
          if-no-files-found: error
